[project]
name = "voice-clone-service"
version = "0.1.0"
description = "Voice-cloning TTS HTTP service for Citadel nodes (Chatterbox default, OmniVoice opt-in)"
requires-python = ">=3.10"
# Runtime deps are installed by the Dockerfile (chatterbox-tts and omnivoice
# with no-deps, because their transformers pins conflict). This list is the
# API layer only, which is what the host-side tests need.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.ruff]
line-length = 100
