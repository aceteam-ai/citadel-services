# Build and publish the voice-clone TTS service image to GitHub Container Registry.
#
# Publishes ghcr.io/aceteam-ai/voice-clone-service:latest, the tag referenced by
# services/voice-clone/compose.yml. The image is GPU only (CUDA torch, about
# 6.5 GB), so the job frees runner disk before building.
#
# Auth uses the built-in GITHUB_TOKEN with packages:write, so no PAT or custom
# secret is required.
name: publish-voice-clone-image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "services/voice-clone/build/**"
      - ".github/workflows/publish-voice-clone-image.yml"

env:
  IMAGE: ghcr.io/aceteam-ai/voice-clone-service

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :latest plus a short-SHA tag for traceability.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: services/voice-clone/build
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
